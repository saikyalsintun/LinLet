<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>LinLett Money Transfer and Exchange</title>
  <style>
    :root {
      --gold: #c99a3b;
      --gold-dark: #9a7022;
      --gold-pale: #fff7e6;
      --text: #292929;
      --muted: #777777;
      --border: #e9e9e9;
      --background: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      padding: 22px 24px;
    }
    .brand {
      width: min(100%, 1000px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      font-size: 16px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--gold-pale);
      border: 1px solid #efdfba;
      color: var(--gold-dark);
      font-family: Georgia, serif;
      font-size: 21px;
    }
    main {
      flex: 1;
      width: min(100% - 40px, 620px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 0;
    }
    .intro { text-align: center; margin-bottom: 32px; }
    h1 { font-size: clamp(25px, 4vw, 34px); line-height: 1.25; margin: 0 0 12px; letter-spacing: -.7px; }
    .intro p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0; }
    .links { display: grid; gap: 14px; }
    .link-button {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      min-height: 82px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .link-button:hover {
      border-color: var(--gold);
      background: #fffdf8;
      transform: translateY(-2px);
    }
    .link-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      border-radius: 11px;
      background: var(--gold-pale);
      color: var(--gold-dark);
    }
    .link-icon svg { width: 22px; height: 22px; }
    .link-copy { flex: 1; }
    .link-copy strong { display: block; font-size: 16px; margin-bottom: 5px; }
    .link-copy span { color: var(--muted); font-size: 13px; }
    .arrow {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 9px;
      background: var(--gold);
      color: white;
      font-size: 20px;
      line-height: 1;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #999;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    @media (max-width: 480px) {
      header { padding: 17px 16px; }
      .brand { font-size: 13px; }
      main { width: calc(100% - 32px); padding: 46px 0; }
      .link-button { padding: 15px; gap: 12px; }
      .link-copy span { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">L</span>
      <span>LinLett Money Transfer and Exchange</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>Choose a service</h1>
      <p>Select a section to continue to its website.</p>
    </section>

    <nav class="links" aria-label="Service links">
      <a class="link-button" href="./Balance/" aria-label="Go to Balance website">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="13" rx="2"></rect>
            <path d="M3 10h18M7 15h3M7 3h10"></path>
          </svg>
        </span>
        <span class="link-copy">
          <strong>Balance</strong>
          <span>Open the balance website</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-button" href="./Service/" aria-label="Go to Service website">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M8.5 12h7M12 8.5v7"></path>
          </svg>
        </span>
        <span class="link-copy">
          <strong>Service</strong>
          <span>Open the service website</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>


      <a class="link-button" href="https://script.google.com/macros/s/AKfycbwHRrchcy_hLZ2NyaZ6Rm-HOiNAI4DKSqqb5byeUTa0asuc8SnPVGH8Wtms9Rdoqo4_wQ/exec" target="_blank" rel="noopener noreferrer" aria-label="Open Dashboard website">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </span>
        <span class="link-copy">
          <strong>Dashboard</strong>
          <span>Open the dashboard in Google Apps Script</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link-button" href="./Cash/index.html" aria-label="Go to Cash website">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M7 9h.01M17 15h.01"></path>
          </svg>
        </span>
        <span class="link-copy">
          <strong>Cash</strong>
          <span>Open the cash website</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>

  <footer>© <span id="year"></span> LinLett Money Transfer and Exchange</footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
